[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multiresolution-transformer"
version = "0.1.0"
description = "A transformer that forecasts short-horizon price ranges by attending across multiple timeframes in a single token stream"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry Dube" }]
keywords = ["time-series", "transformer", "forecasting", "tensorflow", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tensorflow>=2.16,<2.17",
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "polars>=0.20",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Heatmap rendering in regression.best_noise
viz = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/deetailed/multiresolution-transformer"

[tool.setuptools.packages.find]
where = ["."]
include = ["constants*", "core*", "regression*", "legacy*"]

[tool.setuptools]
# Scripts read relative paths (data/, models/); run them from the project root.
zip-safe = false
